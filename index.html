    <script>
      // Legacy VitePress theme key migration: seed appica theme storage from it.
      try {
        var legacy = localStorage.getItem("vitepress-theme-appearance");
        if (legacy && !localStorage.getItem("theme")) {
          localStorage.setItem("theme", legacy === "dark" ? "dark" : "light");
        }
      } catch (e) {}
    </script>
